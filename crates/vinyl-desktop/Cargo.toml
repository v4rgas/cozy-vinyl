[package]
name = "vinyl-desktop"
version = "0.1.0"
edition = "2021"
default-run = "vinyl-desktop"
license = "MIT"

[dependencies]
vinyl-core = { path = "../vinyl-core" }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
glam = "0.30"
fontdue = "0.9"
cpal = "0.16"
symphonia = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "hdr"] }
